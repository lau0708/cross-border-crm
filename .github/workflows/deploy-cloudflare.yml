name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/chat-first-demo/dist/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # 未配置 Cloudflare 凭据时自动跳过，不报错
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy static demo to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy examples/chat-first-demo/dist --project-name lau-crm-demo
