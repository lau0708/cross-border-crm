name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/chat-first-demo/dist/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy static demo (skips if secrets missing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets 未配置，跳过部署"
            exit 0
          fi
          npx --yes wrangler@latest pages deploy examples/chat-first-demo/dist --project-name lau-crm-demo
